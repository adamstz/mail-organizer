services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # Read straight from the .env file rather than interpolating ${VARS} from
    # the host shell - if you also export STORAGE_BACKEND/JWT_SECRET/etc.
    # natively (e.g. via ~/.bashrc), those would otherwise silently win over
    # .env and point the container at config that doesn't exist in-container
    # (like a Postgres tunnel only set up on the host).
    env_file:
      - .env
    environment:
      - STORAGE_DB_PATH=/app/mail.db
    extra_hosts:
      # Lets the container resolve "host.docker.internal" on Linux too (Docker
      # Desktop on Mac/Windows already supports this out of the box).
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      # "localhost" inside this container would point at itself, not backend.
      - BACKEND_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
